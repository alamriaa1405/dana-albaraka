{% extends "base.html" %}{% block page_title %}فاتورة شراء جديدة{% endblock %}{% block page_subtitle %}فواتير المشتريات › فاتورة شراء جديدة{% endblock %}{% block c %}<form method="post">
<section class="panel"><div class="form-grid"><select name="supplier_id"><option value="">المورد</option>{% for s in suppliers %}<option value="{{s.id}}">{{s.name}}</option>{% endfor %}</select><input name="invoice_no" placeholder="رقم فاتورة المورد"><select name="status"><option>مسودة</option><option selected>معتمدة</option></select><select name="payment_status"><option>مدفوع</option><option>غير مدفوع</option></select><select name="payment_method"><option>نقدي</option><option>مدى</option><option>تحويل</option><option>آجل</option></select><input name="attachment" placeholder="مرفق الفاتورة (اختياري)"></div></section>
<section class="panel"><h2>المنتجات</h2><div class="form-grid"><div class="field span2"><label>SKU / قراءة الباركود</label><input id="pc" name="product_code" required autofocus></div><input name="qty" type="number" step="0.01" value="1"><input name="unit_cost" type="number" step="0.01" placeholder="سعر الشراء"><small id="ph" class="span2"></small><button type="button" class="ghost">+ منتج جديد</button></div></section><div class="sticky-actions"><a class="btn ghost" href="/purchases">إلغاء</a><button class="primary">حفظ الفاتورة</button></div></form>
<script>let z;pc.oninput=()=>{clearTimeout(z);z=setTimeout(async()=>{let r=await fetch('/api/product-by-code?code='+encodeURIComponent(pc.value));let d=await r.json().catch(()=>({}));ph.textContent=d.ok?'المنتج: '+d.name+' — التكلفة الحالية '+d.cost+' — المخزون '+d.stock:'لم يتم العثور على المنتج'},160)}</script>{% endblock %}
