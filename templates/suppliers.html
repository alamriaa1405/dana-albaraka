{% extends "base.html" %}{% block page_title %}الموردين{% endblock %}{% block c %}<div class="toolbar"><form method="get" class="search"><input name="q" value="{{q}}" placeholder="البحث باسم المورد أو الرقم"><button>بحث</button></form><button class="primary" onclick="add.showModal()">+ مورد جديد</button><button class="ghost">استيراد</button></div><dialog id="add"><form method="post" class="stack"><input name="name" placeholder="اسم المورد" required><input name="phone" placeholder="الجوال"><input name="email" placeholder="البريد"><input name="city" placeholder="المدينة"><input name="credit_limit" type="number" placeholder="حد الائتمان"><button class="primary">حفظ</button></form></dialog><section class="panel"><div class="table-wrap"><table><tr><th>رقم المورد</th><th>اسم المورد</th><th>المبلغ المستحق</th><th>المدينة</th><th>حد الائتمان</th><th>الحالة</th></tr>{% for x in rows %}<tr><td>{{x.id}}</td><td>{{x.name}}</td><td>{{x.balance}}</td><td>{{x.city or '-'}}</td><td>{{x.credit_limit}}</td><td><span class="badge ok">{{'نشط' if x.active else 'موقوف'}}</span></td></tr>{% endfor %}</table></div></section>{% endblock %}
