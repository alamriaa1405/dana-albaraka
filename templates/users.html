{% extends "base.html" %}{% block page_title %}المستخدمين{% endblock %}{% block c %}<section class="panel"><form method="post" class="form-grid"><input name="username" placeholder="اسم المستخدم" required><input name="password" type="password" placeholder="كلمة المرور" required><select name="role"><option>موظف</option><option>مشرف</option></select><label><input type="checkbox" name="permissions" value="بيع"> بيع</label><label><input type="checkbox" name="permissions" value="مخزون"> مخزون</label><label><input type="checkbox" name="permissions" value="مشتريات"> مشتريات</label><button class="primary">+ مستخدم</button></form></section><section class="panel"><div class="table-wrap"><table><tr><th>المستخدم</th><th>الدور</th><th>الصلاحيات</th><th>الحالة</th></tr>{% for x in rows %}<tr><td>{{x.username}}</td><td>{{x.role}}</td><td>{{x.permissions}}</td><td><span class="badge ok">{{'نشط' if x.active else 'موقوف'}}</span></td></tr>{% endfor %}</table></div></section>{% endblock %}
