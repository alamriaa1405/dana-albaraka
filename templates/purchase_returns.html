{% extends "base.html" %}{% block page_title %}فواتير مردود المشتريات{% endblock %}{% block c %}<section class="panel"><form method="post" class="form-grid"><select name="supplier_id"><option value="">المورد</option>{% for x in suppliers %}<option value="{{x.id}}">{{x.name}}</option>{% endfor %}</select><input name="purchase_id" placeholder="رقم فاتورة الشراء"><input name="total" type="number" step="0.01" placeholder="الإجمالي"><input name="note" placeholder="ملاحظة"><button class="primary">إنشاء مردود</button></form></section><section class="panel"><div class="table-wrap"><table><tr><th>رقم</th><th>التاريخ</th><th>المورد</th><th>الفاتورة</th><th>الإجمالي</th></tr>{% for x in rows %}<tr><td>{{x.id}}</td><td>{{x.created_at[:16]}}</td><td>{{x.supplier_name or '-'}}</td><td>{{x.purchase_id or '-'}}</td><td>{{x.total}}</td></tr>{% endfor %}</table></div></section>{% endblock %}
