{% extends "base.html" %}{% block page_title %}الأصول الثابتة{% endblock %}{% block c %}<section class="panel"><form method="post" class="form-grid"><input name="name" placeholder="اسم الأصل" required><input name="purchase_date" type="date"><input name="cost" type="number" step="0.01" placeholder="التكلفة"><input name="useful_life" type="number" placeholder="العمر الإنتاجي بالشهور"><input name="note" placeholder="ملاحظة"><button class="primary">+ أصل جديد</button></form></section><section class="panel"><div class="table-wrap"><table><tr><th>الاسم</th><th>تاريخ الشراء</th><th>التكلفة</th><th>العمر الإنتاجي</th></tr>{% for x in rows %}<tr><td>{{x.name}}</td><td>{{x.purchase_date}}</td><td>{{x.cost}}</td><td>{{x.useful_life}}</td></tr>{% endfor %}</table></div></section>{% endblock %}
