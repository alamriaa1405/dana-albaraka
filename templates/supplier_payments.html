{% extends "base.html" %}{% block page_title %}مدفوعات الموردين{% endblock %}{% block c %}<section class="panel"><form method="post" class="form-grid"><select name="supplier_id">{% for s in suppliers %}<option value="{{s.id}}">{{s.name}}</option>{% endfor %}</select><input name="amount" type="number" step="0.01" placeholder="المبلغ"><select name="method"><option>نقدي</option><option>تحويل</option><option>مدى</option></select><input name="note" placeholder="ملاحظة"><button class="primary">+ إنشاء سند دفع</button></form></section><section class="panel"><div class="table-wrap"><table><tr><th>رقم العملية</th><th>تاريخ الدفع</th><th>المورد</th><th>المبلغ</th><th>طريقة الدفع</th></tr>{% for x in rows %}<tr><td>{{x.id}}</td><td>{{x.created_at[:16]}}</td><td>{{x.supplier_name}}</td><td>{{x.amount}}</td><td>{{x.method}}</td></tr>{% endfor %}</table></div></section>{% endblock %}
