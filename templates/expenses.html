{% extends "base.html" %}{% block page_title %}المصروفات{% endblock %}{% block c %}<div class="tabs-row"><span class="active">المصروفات</span><span>مصروفات مجدولة</span><span>ملخص</span></div><section class="panel"><form method="post" class="form-grid"><input name="title" placeholder="اسم المصروف" required><input name="category" placeholder="فئة المصروف"><input name="amount" type="number" step="0.01" placeholder="المبلغ" required><select name="status"><option>مدفوع</option><option>غير مدفوع</option></select><input name="note" placeholder="ملاحظة"><button class="primary">+ مصروف جديد</button></form></section><section class="panel"><div class="table-wrap"><table><tr><th>رقم المصروف</th><th>اسم المصروف</th><th>الفئة</th><th>الموقع</th><th>المبلغ</th><th>حالة السداد</th></tr>{% for x in rows %}<tr><td>Exp-{{x.id}}</td><td>{{x.title}}</td><td>{{x.category or '-'}}</td><td>{{x.location}}</td><td>{{x.amount}}</td><td><span class="badge ok">{{x.status}}</span></td></tr>{% endfor %}</table></div></section>{% endblock %}
