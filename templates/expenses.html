{% extends "base.html" %}{% block c %}<h1>المصروفات</h1><form method="post" class="grid"><input name="title" placeholder="بيان المصروف" required><input name="amount" type="number" step=".01" placeholder="المبلغ" required><input name="note" placeholder="ملاحظة"><button>تسجيل</button></form><table><tr><th>التاريخ</th><th>البيان</th><th>المبلغ</th><th>ملاحظة</th></tr>{% for x in rows %}<tr><td>{{x.created_at}}</td><td>{{x.title}}</td><td>{{x.amount}}</td><td>{{x.note or '-'}}</td></tr>{% endfor %}</table>{% endblock %}
