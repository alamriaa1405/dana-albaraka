{% extends "base.html" %}{% block page_title %}تحويل مخزون{% endblock %}{% block c %}<section class="panel"><form method="post" class="form-grid"><input name="from_location" value="الفرع الرئيسي"><input name="to_location" placeholder="إلى الموقع"><select name="product_id">{% for p in products %}<option value="{{p.id}}">{{p.name}}</option>{% endfor %}</select><input name="qty" type="number" step="0.01" placeholder="الكمية"><button class="primary">تحويل</button></form></section><section class="panel"><div class="table-wrap"><table><tr><th>التاريخ</th><th>من</th><th>إلى</th><th>المنتج</th><th>الكمية</th><th>الحالة</th></tr>{% for x in rows %}<tr><td>{{x.created_at[:16]}}</td><td>{{x.from_location}}</td><td>{{x.to_location}}</td><td>{{x.product_name}}</td><td>{{x.qty}}</td><td>{{x.status}}</td></tr>{% endfor %}</table></div></section>{% endblock %}
