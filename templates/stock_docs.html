{% extends "base.html" %}{% block page_title %}السندات المخزنية{% endblock %}{% block c %}<section class="panel"><form method="post" class="form-grid"><select name="doc_type"><option>إضافة</option><option>صرف</option><option>تسوية</option></select><select name="product_id">{% for p in products %}<option value="{{p.id}}">{{p.name}}</option>{% endfor %}</select><input name="qty" type="number" step="0.01" placeholder="الكمية"><input name="note" placeholder="ملاحظة"><button class="primary">حفظ السند</button></form></section><section class="panel"><div class="table-wrap"><table><tr><th>رقم</th><th>التاريخ</th><th>النوع</th><th>المنتج</th><th>الكمية</th><th>الموقع</th></tr>{% for x in rows %}<tr><td>{{x.id}}</td><td>{{x.created_at[:16]}}</td><td>{{x.doc_type}}</td><td>{{x.product_name}}</td><td>{{x.qty}}</td><td>{{x.location}}</td></tr>{% endfor %}</table></div></section>{% endblock %}
