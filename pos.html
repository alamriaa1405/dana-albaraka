{% extends "base.html" %}{% block page_title %}نقاط البيع{% endblock %}{% block page_subtitle %}بيع سريع بالكود أو قارئ الباركود{% endblock %}{% block c %}
<div class="two-col"><section class="panel"><h2>عملية بيع جديدة</h2><form method="post" class="stack"><input id="barcode" class="scan" name="barcode" placeholder="SKU / قراءة الباركود" required autofocus><small id="hint"></small><div class="two"><input name="qty" type="number" step="0.01" value="1"><select name="payment_method"><option>نقدي</option><option>مدى</option><option>تحويل</option><option>آجل</option></select></div><select name="customer_id"><option value="">العميل (اختياري)</option>{% for c in customers %}<option value="{{c.id}}">{{c.name}}</option>{% endfor %}</select><button class="primary">إتمام البيع</button></form></section><section class="panel"><h2>ملاحظات</h2><p>الخانة الواحدة تقبل SKU للمنتج أو SKU للحزمة؛ ويمكن إدخاله مباشرة أو قراءته بقارئ الباركود.</p></section></div>
<script>let t;barcode.oninput=()=>{clearTimeout(t);t=setTimeout(async()=>{let r=await fetch('/api/product-by-code?code='+encodeURIComponent(barcode.value));let d=await r.json().catch(()=>({}));hint.textContent=d.ok?'✓ '+d.name+' — السعر '+d.sale_price+' — المتوفر '+d.stock:'المنتج غير موجود'},150)}</script>{% endblock %}
